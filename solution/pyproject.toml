[project]
name = "capstone-solution"
version = "0.1.0"
description = "Hospital Operations & Revenue Risk Intelligence Platform - capstone solution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "sqlalchemy>=2.0.52",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capstone"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["phase5_api/tests"]
addopts = "-q"
